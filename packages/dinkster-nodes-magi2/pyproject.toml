[project]
name = "dinkster-magi2"
version = "0.0.1"
description = "Dinkster MAGI-2 audio-video model nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_magi2"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_magi2/dinkster-pack.toml"
"locales" = "dinkster_magi2/locales"

[tool.uv.sources]
dinkster-pack-helpers = { workspace = true }
