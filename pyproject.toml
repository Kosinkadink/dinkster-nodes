[project]
name = "dinkster-nodes-workspace"
version = "0.0.0"
description = "Development workspace for first-party Dinkster node packs"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
dinkster = { url = "https://github.com/Kosinkadink/Dinkster/releases/download/main-2026-11-10-0.0.3.dev232-b85e3f5f/dinkster-0.0.3.dev232%2Bg1dc4259011d039f3ba22c59fabb0b2d543433162-py3-none-any.whl" }
dinkster-api = { url = "https://github.com/Kosinkadink/Dinkster/releases/download/main-2026-11-10-0.0.3.dev232-b85e3f5f/dinkster_api-0.0.3.dev232%2Bg1dc4259011d039f3ba22c59fabb0b2d543433162-py3-none-any.whl" }
dinkster-supervisor = { url = "https://github.com/Kosinkadink/Dinkster/releases/download/main-2026-11-10-0.0.3.dev232-b85e3f5f/dinkster_supervisor-0.0.3-py3-none-any.whl" }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "dinkster>=0.0.2",
    "dinkster-supervisor>=0.0.3",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
    "hypothesis>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["dinkster", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/first_party_runtime"]
