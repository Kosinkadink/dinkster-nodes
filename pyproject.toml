[project]
name = "dinkster-nodes-workspace"
version = "0.0.0"
description = "Development workspace for first-party Dinkster node packs"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
    "hypothesis>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
pythonpath = [".", "tests/first_party_runtime"]
